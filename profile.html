<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil - Sistem Tugas Mahasiswa</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #1a56db;
    --primary-dark: #1440b0;
    --sidebar-bg: #1a1f2e;
    --sidebar-active: #1a56db;
    --sidebar-text: #a0aec0;
    --bg: #f0f4ff;
    --card: #fff;
    --text: #1a202c;
    --text-muted: #718096;
    --border: #e2e8f0;
    --radius: 12px;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 220px;
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 100;
  }

  .sidebar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px 18px 24px;
    border-bottom: 1px solid #2d3447;
  }

  .sidebar-logo-icon {
    width: 36px; height: 36px;
    background: var(--primary);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .sidebar-logo-text {
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    line-height: 1.3;
  }

  .sidebar-nav {
    flex: 1;
    padding: 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    color: var(--sidebar-text);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: background .15s, color .15s;
    text-decoration: none;
  }

  .nav-item:hover { background: rgba(255,255,255,.07); color: #fff; }
  .nav-item.active { background: var(--sidebar-active); color: #fff; }

  .sidebar-logout {
    padding: 14px 22px;
    border-top: 1px solid #2d3447;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fc8181;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
  }

  .sidebar-logout:hover { color: #feb2b2; }

  /* ── MAIN ── */
  .main {
    margin-left: 220px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .topbar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .topbar-menu {
    font-size: 22px;
    cursor: pointer;
    color: var(--text-muted);
    display: none;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: var(--text-muted);
  }

  .topbar-right strong { color: var(--text); }

  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #c3d9f5;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: var(--primary);
  }

  .content { padding: 32px; flex: 1; }

  .page-title { font-size: 26px; font-weight: 800; margin-bottom: 4px; }
  .page-subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }

  /* ── PROFIL CARD ── */
  .profile-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 32px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    max-width: 680px;
  }

  .profile-top {
    display: flex;
    align-items: flex-start;
    gap: 28px;
    margin-bottom: 28px;
  }

  .profile-avatar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .profile-avatar {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: #c3d9f5;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    font-weight: 700;
    color: var(--primary);
    overflow: hidden;
  }

  .profile-avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  .btn-outline {
    padding: 7px 18px;
    border: 1.5px solid var(--primary);
    color: var(--primary);
    background: transparent;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }

  .btn-outline:hover { background: var(--primary); color: #fff; }

  .profile-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px 32px;
    flex: 1;
  }

  .info-row { display: flex; flex-direction: column; gap: 3px; }

  .info-label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  .info-value { font-size: 14px; font-weight: 500; }

  .btn-edit {
    padding: 10px 28px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
  }

  .btn-edit:hover { background: var(--primary-dark); }

  /* ── MODAL EDIT ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: #fff;
    border-radius: 14px;
    padding: 32px;
    width: 480px;
    max-width: 95vw;
  }

  .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .form-group { display: flex; flex-direction: column; gap: 5px; }

  .form-group label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .form-group input {
    padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }

  .form-group input:focus { border-color: var(--primary); }

  .modal-actions {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    margin-top: 22px;
  }

  .btn-cancel {
    padding: 9px 22px;
    border: 1.5px solid var(--border);
    background: transparent;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }

  .btn-save {
    padding: 9px 22px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-save:hover { background: var(--primary-dark); }

  /* ── RESPONSIVE ── */
  @media (max-width: 700px) {
    .sidebar { transform: translateX(-100%); transition: transform .3s; }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .topbar-menu { display: block; }
    .content { padding: 20px 16px; }
    .profile-top { flex-direction: column; align-items: center; }
    .profile-info-grid { grid-template-columns: 1fr; }
    .modal-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">📋</div>
      <div class="sidebar-logo-text">Sistem Tugas<br>Mahasiswa</div>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html">🏠 Dashboard</a>
      <a class="nav-item active" href="profil.html">👤 Profil</a>
      <a class="nav-item" href="tentang.html">ℹ️ Tentang Kami</a>
      <a class="nav-item" href="kontak.html">✉️ Kontak</a>
    </nav>
    <div class="sidebar-logout" onclick="doLogout()">🚪 Logout</div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <span class="topbar-menu" onclick="toggleSidebar()">☰</span>
      <div></div>
      <div class="topbar-right">
        Selamat datang, <strong id="greeting-name">-</strong>
        <div class="avatar" id="topbar-avatar">-</div>
      </div>
    </header>

    <main class="content">
      <h1 class="page-title">Profil Saya</h1>
      <p class="page-subtitle">Informasi akun dan data diri</p>

      <div class="profile-card">
        <div class="profile-top">

          <!-- FOTO & TOMBOL UBAH -->
          <div class="profile-avatar-wrap">
            <div class="profile-avatar" id="profile-avatar">A</div>
            <button class="btn-outline"
              onclick="document.getElementById('file-foto').click()">
              Ubah Foto
            </button>
            <input type="file" id="file-foto" accept="image/*"
              style="display:none" onchange="changePhoto(event)">
          </div>

          <!-- DATA DIRI -->
          <div class="profile-info-grid">
            <div class="info-row">
              <span class="info-label">Nama</span>
              <span class="info-value" id="info-nama">Atik</span>
            </div>
            <div class="info-row">
              <span class="info-label">NIM</span>
              <span class="info-value" id="info-nim">2310111001</span>
            </div>
            <div class="info-row">
              <span class="info-label">Program Studi</span>
              <span class="info-value" id="info-prodi">Sistem Informasi</span>
            </div>
            <div class="info-row">
              <span class="info-label">Email</span>
              <span class="info-value" id="info-email">atik@example.com</span>
            </div>
            <div class="info-row">
              <span class="info-label">No. Telepon</span>
              <span class="info-value" id="info-telp">0812-3456-7890</span>
            </div>
            <div class="info-row">
              <span class="info-label">Alamat</span>
              <span class="info-value" id="info-alamat">Pekanbaru, Riau</span>
            </div>
          </div>

        </div>
        <button class="btn-edit" onclick="openModal()">Edit Profil</button>
      </div>
    </main>
  </div>

  <!-- MODAL EDIT PROFIL -->
  <div class="modal-overlay" id="modal-edit">
    <div class="modal">
      <h3>Edit Profil</h3>
      <div class="modal-grid">
        <div class="form-group">
          <label>Nama</label>
          <input type="text" id="edit-nama">
        </div>
        <div class="form-group">
          <label>NIM</label>
          <input type="text" id="edit-nim">
        </div>
        <div class="form-group">
          <label>Program Studi</label>
          <input type="text" id="edit-prodi">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="edit-email">
        </div>
        <div class="form-group">
          <label>No. Telepon</label>
          <input type="text" id="edit-telp">
        </div>
        <div class="form-group">
          <label>Alamat</label>
          <input type="text" id="edit-alamat">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Batal</button>
        <button class="btn-save" onclick="saveProfile()">Simpan</button>
      </div>
    </div>
  </div>

<script>
  // Data profil (bisa diganti dari localStorage/database)
  let profile = {
    nama   : localStorage.getItem('p_nama')   || 'Atik',
    nim    : localStorage.getItem('p_nim')    || '2310111001',
    prodi  : localStorage.getItem('p_prodi')  || 'Sistem Informasi',
    email  : localStorage.getItem('p_email')  || 'atik@example.com',
    telp   : localStorage.getItem('p_telp')   || '0812-3456-7890',
    alamat : localStorage.getItem('p_alamat') || 'Pekanbaru, Riau',
  };

  // Tampilkan data saat halaman dimuat
  function renderProfile() {
    document.getElementById('info-nama').textContent   = profile.nama;
    document.getElementById('info-nim').textContent    = profile.nim;
    document.getElementById('info-prodi').textContent  = profile.prodi;
    document.getElementById('info-email').textContent  = profile.email;
    document.getElementById('info-telp').textContent   = profile.telp;
    document.getElementById('info-alamat').textContent = profile.alamat;

    const user = localStorage.getItem('stm_user') || profile.nama;
    document.getElementById('greeting-name').textContent = user;
    document.getElementById('topbar-avatar').textContent = user.charAt(0).toUpperCase();

    const av = document.getElementById('profile-avatar');
    if (!av.querySelector('img')) {
      av.textContent = profile.nama.charAt(0).toUpperCase();
    }
  }

  renderProfile();

  // Ubah foto
  function changePhoto(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const av = document.getElementById('profile-avatar');
      av.innerHTML = `<img src="${ev.target.result}">`;
    };
    reader.readAsDataURL(file);
  }

  // Buka modal edit
  function openModal() {
    document.getElementById('edit-nama').value   = profile.nama;
    document.getElementById('edit-nim').value    = profile.nim;
    document.getElementById('edit-prodi').value  = profile.prodi;
    document.getElementById('edit-email').value  = profile.email;
    document.getElementById('edit-telp').value   = profile.telp;
    document.getElementById('edit-alamat').value = profile.alamat;
    document.getElementById('modal-edit').classList.add('open');
  }

  // Tutup modal
  function closeModal() {
    document.getElementById('modal-edit').classList.remove('open');
  }

  // Klik luar modal = tutup
  document.getElementById('modal-edit').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // Simpan profil
  function saveProfile() {
    profile.nama   = document.getElementById('edit-nama').value   || profile.nama;
    profile.nim    = document.getElementById('edit-nim').value    || profile.nim;
    profile.prodi  = document.getElementById('edit-prodi').value  || profile.prodi;
    profile.email  = document.getElementById('edit-email').value  || profile.email;
    profile.telp   = document.getElementById('edit-telp').value   || profile.telp;
    profile.alamat = document.getElementById('edit-alamat').value || profile.alamat;

    // Simpan ke localStorage agar tidak hilang saat refresh
    localStorage.setItem('p_nama',   profile.nama);
    localStorage.setItem('p_nim',    profile.nim);
    localStorage.setItem('p_prodi',  profile.prodi);
    localStorage.setItem('p_email',  profile.email);
    localStorage.setItem('p_telp',   profile.telp);
    localStorage.setItem('p_alamat', profile.alamat);

    renderProfile();
    closeModal();
  }

  function doLogout() {
    localStorage.removeItem('stm_user');
    window.location.href = 'login.html';
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
  }
</script>
s
</body>
</html>
