<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Tugas Mahasiswa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS INTERNAL --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        .login-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* Sisi Kiri: Informasi & Ilustrasi */
        .left-section {
            flex: 1;
            background-color: #C6D7FF; /* Warna biru muda */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 40px;
            text-align: center;
        }

        .left-content {
            max-width: 400px;
        }

        /* Ikon Ilustrasi menggunakan SVG */
        .illustration-svg {
            width: 140px;
            height: 140px;
            margin-bottom: 25px;
            fill: #1A365D;
        }

        .left-section h2 {
            color: #1A365D;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .left-section p {
            color: #4A5568;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .footer-left {
            position: absolute;
            bottom: 20px;
            left: 40px;
            font-size: 0.8rem;
            color: #718096;
        }

        /* Sisi Kanan: Formulir Login */
        .right-section {
            flex: 1;
            background-color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
        }

        .login-box h2 {
            font-size: 2rem;
            color: #1A202C;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 30px;
        }

        /* Form Styling */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #2D3748;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #1D58DB;
        }

        /* Password Wrapper untuk Ikon Mata */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            cursor: pointer;
            color: #A0AEC0;
            font-size: 1.1rem;
        }

        /* Tombol Login */
        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #1D58DB; /* Biru cerah */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-login:hover {
            background-color: #1A4BBA;
        }

        .signup-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
            color: #718096;
        }

        .signup-text a {
            color: #1D58DB;
            text-decoration: none;
            font-weight: 500;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        /* Responsive Layar HP */
        @media (max-width: 768px) {
            body, html {
                overflow: auto;
            }
            .login-container {
                flex-direction: column;
                height: auto;
            }
            .left-section {
                padding: 50px 20px;
            }
            .footer-left {
                position: relative;
                bottom: auto;
                left: auto;
                margin-top: 30px;
            }
            .right-section {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        
        <div class="left-section">
            <div class="left-content">
                <svg class="illustration-svg" viewBox="0 0 24 24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                </svg>
                <h2>Sistem Tugas Mahasiswa</h2>
                <p>Kelola dan pantau seluruh tugas kuliah Anda dalam satu platform yang terintegrasi.</p>
            </div>
            <div class="footer-left">
                &copy; 2026 Sistem Tugas Mahasiswa
            </div>
        </div>

        <div class="right-section">
            <div class="login-box">
                <h2>Login</h2>
                <p class="subtitle">Masukkan username dan password Anda</p>

                <form action="#" method="POST">
                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Masukkan username" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder="Masukkan password" required>
                            <span class="toggle-password">&#128065;</span>
                        </div>
                    </div>

                    <button type="submit" class="btn-login">Login</button>
                </form>

                <p class="signup-text">Belum punya akun? <a href="#">Hubungi admin</a></p>
            </div>
        </div>

    </div>

</body>
</html>
